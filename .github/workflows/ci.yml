name: CI

# ────────────────────────────────────────────────────────────────────────────────────────────────
# The estate-wide half of this file is a CALL, not a copy. The 188 lines it replaces said so
# themselves: "THIS FILE IS TEMPORARY … deleted and replaced by a call to the shared reusable
# workflow". That workflow exists, so this is that deletion.
#
# WHAT THE COPY COST WHILE IT SURVIVED. service-ci.yml runs a step no bespoke file had: it derives
# every scope this service's route gates demand and fails if one is absent from the registry in
# @cloudsforge/contracts-auth. identity refuses to mint a token naming an unknown scope, so an
# unregistered scope is a service-to-service surface no identity-issued token can ever reach, and
# no suite notices because each mints its own principals. This repository currently derives ZERO
# demanded scopes — it is a BFF that authenticates the END USER and holds a separate credential per
# upstream, so it gates on no service scope of its own. That zero is now a CHECKED zero rather than
# an unexamined one: the first route gate added here without a registered scope fails the build.
#
# `postgres: false`, and it is the point of this service rather than an economy. A BFF with a table
# is a BFF holding a stale copy of somebody else's truth; the `controls` job below asserts that no
# connection string can appear in src/ at all, which is stricter than the shared workflow's rule 1.
# The suite boots seven fake upstreams on ephemeral ports and needs no database — which is what
# makes the degradation suite runnable at all, since it needs to KILL upstreams.
# ────────────────────────────────────────────────────────────────────────────────────────────────

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  estate:
    uses: cloudsforge-online/micro-org/.github/workflows/service-ci.yml@main
    with:
      service: hub-api
      port: 4000
      # This service owns no database and must never acquire one. With `postgres: false` the
      # workflow starts no container, exports no DSN, and its image smoke test skips the migrator
      # step — which is correct here, because there is no src/migrator.ts to run.
      postgres: false
      # The image smoke test boots the real service, and src/env.ts validates its configuration at
      # import — so the container needs every variable it declares or it exits before it can serve
      # /livez. What is left below is seven upstream URLs that are never dialled, because /livez
      # calls no upstream. Never a real credential.
      #
      # ── THE SIX `HUB_*_TOKEN` LINES ARE GONE, AND THEIR ABSENCE IS THE POINT ─────────────────
      #
      # This block used to say each one "only has to clear the 24-character length check". That
      # sentence is the defect written into configuration — a 24-character floor is exactly what
      # micro-org #142's 40-character placeholder cleared on 44 containers.
      #
      # The six variables are RETIRED. `env.ts` keeps them only as `legacyServiceTokenPresent`, a
      # presence check it reports and never obeys, and the estate's compose stopped passing them
      # for the same reason. Supplying them here made every smoke run assert that a retired
      # variable was configured — and a variable nothing reads is a secret nothing needed.
      #
      # The AD-05 separation they carried did not go away with them: it moved into the exchange,
      # which mints six narrow tokens from one credential. The `controls` job below still fails the
      # build if a single shared credential is reintroduced as a variable.
      #
      # `HUB_API_IDENTITY_CREDENTIAL` is deliberately NOT added in their place. `env.ts` makes it
      # optional so that THIS job can boot the image without one, `/readyz` — not `/livez` — is
      # where its absence is enforced, and there is no `@generate` for a `cfsc_` credential because
      # identity mints those against a row rather than out of `openssl`.
      #
      # Nothing here needs `=@generate`: this service reads no `OUTBOX_SIGNING_SECRET`. It owns no
      # database and publishes no events, so it is on neither side of the estate's event bus.
      smoke-env: |
        IDENTITY_JWKS_URL=http://127.0.0.1:4001/.well-known/jwks.json
        IDENTITY_ISSUER=http://127.0.0.1:4001
        IDENTITY_URL=http://127.0.0.1:4001
        LEDGER_URL=http://127.0.0.1:4004
        WALLET_URL=http://127.0.0.1:4005
        BILLING_URL=http://127.0.0.1:4009
        ACTIVITY_URL=http://127.0.0.1:4010
        PRICING_URL=http://127.0.0.1:4007
        POLICY_URL=http://127.0.0.1:4011
    secrets:
      # @cloudsforge/* resolves through link:../runtime and link:../contracts rather than a
      # registry, so the workflow checks out micro-runtime and micro-contracts as siblings. Both are
      # private, so it needs a contents:read token.
      estate_token: ${{ secrets.ESTATE_READ_TOKEN }}
    permissions:
      contents: read
      packages: read

  controls:
    name: The controls this service exists to add
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { path: hub-api }
      # Temporary, and for the same reason as the Dockerfile's two named build contexts: the runtime
      # and contracts packages are unpublished and resolve through link:.
      - uses: actions/checkout@v4
        with:
          repository: cloudsforge-online/micro-runtime
          path: runtime
          token: ${{ secrets.ESTATE_READ_TOKEN }}
      - uses: actions/checkout@v4
        with:
          repository: cloudsforge-online/micro-contracts
          path: contracts
          token: ${{ secrets.ESTATE_READ_TOKEN }}

      - name: 'Rule 1 — this service owns no database, and may not acquire one'
        # Stricter than the shared workflow's rule 1, and deliberately: that rule allows a service
        # its OWN connection string, and this service is allowed none at all.
        working-directory: hub-api
        run: |
          if grep -rnE '[A-Z_]*DATABASE_URL' src/ --include='*.ts'; then
            echo '::error::hub-api owns no state; a connection string must not appear in src/'
            exit 1
          fi
          if grep -rnE '(postgres|postgresql)://' src/ --include='*.ts'; then
            echo '::error::a connection string appears in src/'
            exit 1
          fi
          echo 'ok: this service owns no database'

      - name: 'Rule 8 — every background timer is a leased job'
        # The shared workflow bans setInterval. This repository bans setTimeout too: a BFF's
        # fan-out deadlines belong to the HTTP client's own timeout, not to a hand-rolled timer.
        working-directory: hub-api
        run: |
          if grep -rnE '\bset(Interval|Timeout)\(' src/ --include='*.ts'; then
            echo '::error::a timer was found; background work is a leased job (@cloudsforge/jobs)'
            exit 1
          fi
          echo 'ok: no timers'

      - name: 'Every upstream is reached with its own credential'
        # AD-05: the BFF holds a scoped credential per upstream. One shared token would make a
        # compromise of the estate's highest-fan-out surface a compromise of all seven peers.
        working-directory: hub-api
        run: |
          for name in LEDGER WALLET BILLING ACTIVITY PRICING POLICY; do
            grep -q "HUB_${name}_TOKEN" src/env.ts \
              || { echo "::error::HUB_${name}_TOKEN is not declared"; exit 1; }
          done
          if grep -qE "HUB_SERVICE_TOKEN|HUB_UPSTREAM_TOKEN\b" src/env.ts; then
            echo '::error::a single shared upstream credential was introduced'
            exit 1
          fi
          echo 'ok: one credential per upstream'

      - name: 'Every dashboard tile carries a status'
        # The exit criterion of Phase 6, as a check. A tile added without an entry in TILE_SOURCES
        # is a tile the degradation suite cannot reason about.
        working-directory: hub-api
        run: |
          grep -q "export const TILE_SOURCES" src/dashboard.ts \
            || { echo '::error::TILE_SOURCES is gone; the degradation suite has nothing to assert against'; exit 1; }
          grep -q "hub_tile_status_total" src/server.ts \
            || { echo '::error::the tile status metric is not registered'; exit 1; }
          echo 'ok: every tile carries a status'

      # The two image checks the shared workflow does not make. A job cannot see another job's
      # docker daemon, so the image is rebuilt here — against the same GHA cache the `estate` job's
      # image build writes.
      - uses: docker/setup-buildx-action@v3
      - name: Build the image
        uses: docker/build-push-action@v6
        with:
          context: hub-api
          build-contexts: |
            runtimepkgs=runtime
            contractspkgs=contracts
          push: false
          load: true
          tags: hub-api:hygiene
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: 'The image must not run as root'
        # Read off the BUILT IMAGE rather than grepped out of the Dockerfile: a USER line in a stage
        # that is not the final one reads identically in the file and has no effect whatsoever.
        run: |
          user=$(docker image inspect hub-api:hygiene --format '{{.Config.User}}')
          [ "$user" = "node" ] || { echo "::error::image runs as '${user:-root}'"; exit 1; }
          echo "ok: the image runs as ${user}"

      - name: 'The image must not carry a secret'
        # This service holds six upstream credentials. An ENV line would bake one into the image and
        # send it to every registry that mirrors it; the deploy supplies all six at run time.
        run: |
          if docker image inspect hub-api:hygiene --format '{{json .Config.Env}}' \
             | grep -iE 'secret|token|password|key'; then
            echo '::error::a secret-shaped value is baked into the image environment'
            exit 1
          fi
          echo 'ok: no secret-shaped value in the image environment'

  # ──────────────────────────────────────────────────────────────────────────────────────────────
  # THE IMAGE, PUBLISHED. `cfctl release` writes a manifest naming ghcr.io/cloudsforge-online/<repo>
  # at this repository's package.json version (micro-org tools/cfctl.ts:889-934, image name derived
  # at tools/registry.ts:367-369); `cfctl release --verify` runs `docker manifest inspect` on every
  # entry (cfctl.ts:937-975); and deploy/scripts/release-deploy.sh:99-125 refuses to change anything
  # until all of them pull. Until this job existed CI built this image and threw it away, so that
  # gate rejected every service in the estate and the manifest path could not be used at all.
  #
  # `packages: write` IS GRANTED HERE rather than asked for inside the shared CI workflow, and that
  # is forced rather than stylistic: a called workflow's GITHUB_TOKEN can only be maintained or
  # reduced, never elevated, so a reusable workflow asking for a permission its caller withheld
  # fails the whole run at STARTUP — before a step runs, on pull requests as well as on main.
  # Measured on micro-org: run 30900277471 (caller capped at `packages: read`) ended in
  # startup_failure; run 30900280323 (same workflow, caller granted `packages: write`) succeeded.
  # That is also why `push: false` is correct and stays in the shared workflow's image job — that
  # job is a GATE and needs `load:` so it can boot the image and read its health endpoint. This is
  # the producer. Different purposes, so different jobs.
  # ──────────────────────────────────────────────────────────────────────────────────────────────
  publish:
    needs: [estate, controls]
    # A green push to main and nothing else. An image tag a release manifest pins has to name
    # something that passed, on the branch it will be deployed from.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    uses: cloudsforge-online/micro-org/.github/workflows/publish-image.yml@main
    with:
      kind: service
    secrets:
      # The same sibling checkouts the Dockerfile's named build contexts need: the image cannot be
      # built without micro-runtime and micro-contracts beside it.
      estate_token: ${{ secrets.ESTATE_READ_TOKEN }}
    permissions:
      contents: read
      packages: write
